name: pages

# GitHub Pages is optional. The UI is served from jsDelivr without it.
# Manual only so a Pages quota / private-repo paywall does not fail every push.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Assemble site
        run: |
          mkdir -p site/app site/runs
          cp -a docs/. site/
          cp ui/index.html ui/app.css ui/app.js site/app/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
